name: Gen 3 foundation smoke

on:
  push:
    branches:
      - 'feature/gen3-*'
  pull_request:
    paths:
      - 'entry.lua'
      - 'gen3_runtime.lua'
      - 'gen3_core_rules.lua'
      - 'gen3_extra_core.lua'
      - 'gen3_levels.lua'
      - 'gen3_notices.lua'
      - 'gen3_randomizer.lua'
      - 'gen3_playstyles.lua'
      - 'gen3_menu.lua'
      - 'gen3_dev.lua'
      - 'tests/gen3_docs_gate.js'
      - 'CREDITS.md'
      - 'docs/GEN3_FEATURE_MATRIX.md'
      - 'tests/gen3_dev_restore_smoke.lua'
      - 'gen3_display.lua'
      - 'gen3_clauses.lua'
      - 'gen3_catch_rules.lua'
      - 'gen3_variants.lua'
      - 'gen3_battle_items.lua'
      - 'gen3_field_items.lua'
      - 'gen3_services_economy.lua'
      - 'gen3_pokemon_stats.lua'
      - 'gen3_area_splits.lua'
      - 'gen3_run_party.lua'
      - 'gen3_difficulty.lua'
      - 'gen3_hardcore_rules.lua'
      - 'gen3_qol.lua'
      - 'gen3_qol_setup.lua'
      - 'gen3_run_setup.lua'
      - 'gen3_run_results.lua'
      - 'gen3_results_screen.lua'
      - 'gen3_shiny_visuals.lua'
      - 'tests/gen3_shiny_visuals_smoke.lua'
      - 'tests/gen3_run_results_smoke.lua'
      - 'tests/gen3_run_results_runtime_smoke.lua'
      - 'gen3_title_setup.lua'
      - 'tests/gen3_qol_setup_smoke.lua'
      - 'tests/gen3_title_setup_smoke.lua'
      - 'tests/gen3_qol_nickname_boundary_smoke.lua'
      - 'tests/gen3_run_setup_smoke.lua'
      - 'tests/gen3_qol_smoke.lua'
      - 'tests/gen3_hardcore_rules_smoke.lua'
      - 'tests/gen3_difficulty_smoke.lua'
      - 'tests/gen3_run_party_smoke.lua'
      - 'tests/gen3_area_splits_smoke.lua'
      - 'tests/gen3_pokemon_stats_smoke.lua'
      - 'tests/gen3_services_economy_smoke.lua'
      - 'tests/gen3_field_items_smoke.lua'
      - 'tests/gen3_battle_items_smoke.lua'
      - 'tests/gen3_variants_smoke.lua'
      - 'gen3_battle_clauses.lua'
      - 'gen3_status_bans.lua'
      - 'tests/gen3_advanced_status_bans_smoke.lua'
      - 'tests/gen3_advanced_battle_clauses_smoke.lua'
      - 'tests/gen3_advanced_catch_rules_smoke.lua'
      - 'gen3_shiny_rate.lua'
      - 'gen3_archive.lua'
      - 'gen3_eggs.lua'
      - 'gen3_forgiveness.lua'
      - 'tests/gen3_eggs_smoke.lua'
      - 'tests/gen3_forgiveness_smoke.lua'
      - 'tests/gen3_shiny_rate_smoke.lua'
      - 'tests/gen3_owe_shiny_smoke.lua'
      - 'tests/gen3_archive_smoke.lua'
      - 'tests/gen3_clauses_smoke.lua'
      - 'manifest.json'
      - 'tests/gen3_foundation_smoke.lua'
      - 'tests/gen3_new_core_smoke.lua'
      - 'tests/gen3_levels_smoke.lua'
      - 'tests/gen3_randomizer_smoke.lua'
      - 'tests/gen3_shiny_nuzlocke_smoke.lua'
      - 'tests/gen3_hardcore_nuzlocke_smoke.lua'
      - '.github/workflows/gen3-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen3-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gen 3 release documentation and history links
        run: node tests/gen3_docs_gate.js
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Validate new setup Lua syntax
        run: |
          luac5.1 -p main.lua title_setup_compat.lua mod.card
          luac5.1 -p gen3_runtime.lua gen3_menu.lua gen3_dev.lua gen3_title_setup.lua gen3_run_setup.lua gen3_qol_setup.lua gen3_run_results.lua gen3_results_screen.lua gen3_shiny_visuals.lua
          luac5.1 -p tests/gen3_run_results_smoke.lua tests/gen3_run_results_runtime_smoke.lua
      - name: Test FRLG and RSE NEW GAME interception
        run: lua5.1 tests/gen3_title_setup_smoke.lua
      - name: Test new run settings lock and draft isolation
        run: lua5.1 tests/gen3_run_setup_smoke.lua
      - name: Test instant text, starter nickname and lock popup
        run: lua5.1 tests/gen3_qol_nickname_boundary_smoke.lua
      - name: Run isolated Gen 3 hook/state smoke
        run: lua5.1 tests/gen3_foundation_smoke.lua
      - name: Test hidden Nuz Dev archive restoration safety
        run: lua5.1 tests/gen3_dev_restore_smoke.lua
      - name: Run nickname, rival and PC survivors smoke
        run: lua5.1 tests/gen3_new_core_smoke.lua
      - name: Run Gen 3 LEVELS cap and EXP edging smoke
        run: lua5.1 tests/gen3_levels_smoke.lua
      - name: Run Gen 3 Shiny Nuzlocke playstyle smoke
        run: lua5.1 tests/gen3_shiny_nuzlocke_smoke.lua
      - name: Run Gen 3 Hardcore Nuzlocke playstyle smoke
        run: lua5.1 tests/gen3_hardcore_nuzlocke_smoke.lua
      - name: Test End Run, irreversible failed saves and shareable memorial PNG
        run: lua5.1 tests/gen3_run_results_smoke.lua
      - name: Test shiny ROM art, PC portrait and box mini-icons
        run: lua5.1 tests/gen3_shiny_visuals_smoke.lua
      - name: Test terminal native save and Hall of Fame runtime wiring
        run: lua5.1 tests/gen3_run_results_runtime_smoke.lua
      - name: Run Gen 3 seeded randomizer native hook smoke
        run: lua5.1 tests/gen3_randomizer_smoke.lua
      - name: Run isolated Gen 3 clauses policy smoke
        run: lua5.1 tests/gen3_clauses_smoke.lua
      - name: Run Advanced Catch Rules species-ban and BST smoke
        run: lua5.1 tests/gen3_advanced_catch_rules_smoke.lua
      - name: Run Type Locke Gen 3 VARIANTS smoke
        run: lua5.1 tests/gen3_variants_smoke.lua
      - name: Run Advanced Battle Items native transaction policy smoke
        run: lua5.1 tests/gen3_battle_items_smoke.lua
      - name: Run Advanced Field Items policy smoke
        run: lua5.1 tests/gen3_field_items_smoke.lua
      - name: Run Advanced Services and Economy policy smoke
        run: lua5.1 tests/gen3_services_economy_smoke.lua
      - name: Run Advanced Pokemon Stats EV and IV policy smoke
        run: lua5.1 tests/gen3_pokemon_stats_smoke.lua
      - name: Run Advanced Area Splits and Safari policy smoke
        run: lua5.1 tests/gen3_area_splits_smoke.lua
      - name: Run Run and Party policy smoke
        run: lua5.1 tests/gen3_run_party_smoke.lua
      - name: Run Game Difficulty trainer AI and stat profiles smoke
        run: lua5.1 tests/gen3_difficulty_smoke.lua
      - name: Run Hardcore native battle, gym, dungeon and whiteout smoke
        run: lua5.1 tests/gen3_hardcore_rules_smoke.lua
      - name: Run Gen 3 QOL text, movement, pocket and evolution smoke
        run: lua5.1 tests/gen3_qol_smoke.lua
      - name: Run Gen 3 new-game-only QOL Setup resource smoke
        run: lua5.1 tests/gen3_qol_setup_smoke.lua
      - name: Run Advanced Battle Clauses policy smoke
        run: lua5.1 tests/gen3_advanced_battle_clauses_smoke.lua
      - name: Run Advanced Status Bans parent and per-side scope smoke
        run: lua5.1 tests/gen3_advanced_status_bans_smoke.lua
      - name: Run stable shiny-rate policy smoke
        run: lua5.1 tests/gen3_shiny_rate_smoke.lua
      - name: Run Untamed overworld shiny spawn-to-battle compatibility smoke
        run: lua5.1 tests/gen3_owe_shiny_smoke.lua
      - name: Run full-Pokemon archive smoke
        run: lua5.1 tests/gen3_archive_smoke.lua
      - name: Run Egg Encounter provenance smoke
        run: lua5.1 tests/gen3_eggs_smoke.lua
      - name: Run Route Forgiveness policy smoke
        run: lua5.1 tests/gen3_forgiveness_smoke.lua
