name: Publish v3.0.1-beta (one-time)

# Explicit one-time release, triggered only by the version-bump merge commit.
# This workflow is removed after publishing. Routine pushes cannot release.
on:
  push:
    branches: [main]
    paths: [manifest.json]

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, '[publish v3.0.1-beta]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact version and unused release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          m=json.load(open("manifest.json",encoding="utf-8"))
          assert m["version"]=="3.0.1-beta", "Must publish exactly v3.0.1-beta"
          assert m["id"]=="nuzlocke" and m["api"]==2, "Unexpected mod identity/API"
          PY
          if git rev-parse -q --verify refs/tags/v3.0.1-beta >/dev/null; then
            echo "::error::Existing tag: refusing to overwrite"
            exit 1
          fi
          if gh release view v3.0.1-beta >/dev/null 2>&1; then
            echo "::error::Existing release: refusing to overwrite"
            exit 1
          fi
      - name: Validate documentation, current credits, and history
        run: node tests/gen3_docs_gate.js
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Syntax-check all runtime Lua and mod metadata
        run: |
          for f in ./*.lua mod.card; do luac5.1 -p "$f"; done
      - name: Run maintained Gen 3 regressions
        run: bash tests/run_gen3_smoke.sh
      - name: Build reproducible player-only mod ZIP
        run: |
          set -euo pipefail
          bash tests/package_gate.sh dist
          (cd dist && sha256sum nuzlocke-3.0.1-beta.zip > sha256sums.txt)
          unzip -tq dist/nuzlocke-3.0.1-beta.zip
          unzip -Z1 dist/nuzlocke-3.0.1-beta.zip | grep -E '^(entry.lua|gen3_runtime.lua|manifest.json|mod.card)$'
      - name: Prepare curated player-facing release description
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          body=Path("RELEASE_NOTES.md").read_text(encoding="utf-8")
          current=body.split("\n---\n",1)[0].strip()
          assert current.startswith("# Nuzlocke v3.0.1-beta"), "Wrong release notes"
          Path(os.environ["RUNNER_TEMP"],"nuzlocke-notes.md").write_text(current+"\n",encoding="utf-8")
          PY
      - name: Publish GitHub beta with full curated description and ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v3.0.1-beta \
            --target "$GITHUB_SHA" \
            --title "Nuzlocke v3.0.1-beta — A New Generation of Challenges" \
            --prerelease \
            --notes-file "$RUNNER_TEMP/nuzlocke-notes.md" \
            dist/nuzlocke-3.0.1-beta.zip dist/sha256sums.txt
